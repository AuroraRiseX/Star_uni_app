<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .icon-fill {
            font-variation-settings: 'FILL' 1;
        }
        
        /* Glassmorphism utility */
        .glass-panel {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1.5px solid rgba(255, 255, 255, 0.8);
        }
        
        /* Cloud shadow for buttons/cards */
        .cloud-shadow {
            box-shadow: 0 15px 30px -5px rgba(255, 132, 0, 0.1);
        }
        
        /* Squishy button effect */
        .btn-squish {
            box-shadow: 0 4px 0 0 #e8c426; /* inverse-primary as darker yellow */
            transition: all 0.15s ease;
        }
        .btn-squish:active {
            transform: translateY(4px);
            box-shadow: 0 0px 0 0 #e8c426;
        }

        /* Form input focus state overrides */
        input:focus {
            outline: none;

</div>
</div>

<label class="font-label-lg text-label-lg text-primary">性别</label>
<div class="flex gap-4">
<label class="flex-1 relative cursor-pointer group">
<input checked="" class="peer sr-only" name="gender" type="radio" value="boy"/>
<div class="w-full py-3 bg-surface-bright border-2 border-surface-variant rounded-full flex items-center justify-center gap-2 transition-all peer-checked:border-primary peer-checked:bg-primary-container/20 peer-checked:text-primary text-on-surface-variant">

</div>
</div>
