<script>
        // Simple micro-interaction for record buttons
        document.querySelectorAll('button').forEach(btn => {
            if(btn.innerText === '记录') {
                btn.addEventListener('click', () => {
                    btn.classList.add('bg-cloud-gray', 'text-white');
                    btn.innerText = '已记录';
                    setTimeout(() => {
                        btn.classList.remove('bg-cloud-gray', 'text-white');
                        btn.innerText = '记录';
                    }, 2000);
                });
            }
        });

        // Background parallax effect for subtle dopamine feel
        window.addEventListener('mousemove', (e) => {
            const x = (e.clientX / window.innerWidth) * 10;
            const y = (e.clientY / window.innerHeight) * 10;
            document.querySelector('.cloud-float').style.transform = `translate(${x}px, ${y}px)`;
        });
    </script>
