<script>
        const btn = document.getElementById('exchangeBtn');
        btn.addEventListener('click', () => {
            // Success animation mockup
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin">progress_activity</span> 正在处理...';
            setTimeout(() => {
                btn.innerHTML = '<span class="material-symbols-outlined">check_circle</span> 兑换成功！';
                btn.classList.remove('from-secondary-container', 'to-secondary');
                btn.classList.add('bg-energy-green');
                
                // Add star popping effect logic here if needed
            }, 1000);
        });

        // Floating animation for visual elements
        document.addEventListener('DOMContentLoaded', () => {
            const glow = document.querySelector('.hero-glow');
            let angle = 0;
            setInterval(() => {
                angle += 0.05;
                const x = Math.sin(angle) * 10;
                const y = Math.cos(angle) * 10;
                glow.style.transform = `translate(calc(-50% + ${x}px), calc(-50% + ${y}px))`;
            }, 50);
        });
