<!-- Interaction Script -->
<script>
        document.querySelectorAll('.active-press').forEach(button => {
            button.addEventListener('touchstart', () => {
                button.classList.add('scale-95');
            });
            button.addEventListener('touchend', () => {
                button.classList.remove('scale-95');
            });
        });

        // Simple star particle effect on task completion click
        const addButtons = document.querySelectorAll('button:has(.material-symbols-outlined:contains("add"))');
        addButtons.forEach(btn => {
            btn.addEventListener('click', (e) => {
                const rect = btn.getBoundingClientRect();
                createParticle(rect.left + rect.width / 2, rect.top + rect.height / 2);
            });
        });

        function createParticle(x, y) {
            const particle = document.createElement('div');
            particle.className = 'fixed pointer-events-none z-[100] text-primary-container';
            particle.innerHTML = '<span class="material-symbols-outlined" style="font-variation-settings: \'FILL\' 1;">star</span>';
            particle.style.left = x + 'px';
            particle.style.top = y + 'px';
            document.body.appendChild(particle);

            const animation = particle.animate([
                { transform: 'translate(-50%, -50%) scale(0) rotate(0deg)', opacity: 1 },
                { transform: `translate(${(Math.random() - 0.5) * 200}px, ${(Math.random() - 0.8) * 200}px) scale(1.5) rotate(${Math.random() * 360}deg)`, opacity: 0 }
            ], {
                duration: 1000,
                easing: 'cubic-bezier(0, .9, .57, 1)'
            });

            animation.onfinish = () => particle.remove();
        }
    </script>
