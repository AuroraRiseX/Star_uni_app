<script>
        let cloudCount = 3;
        const countDisplay = document.getElementById('cloud-count');
        const cloudContainer = document.getElementById('cloud-container');

        function addCloud(val) {
            cloudCount += val;
            countDisplay.innerText = cloudCount;
            
            // Interaction feedback
            countDisplay.classList.add('scale-125', 'text-error');
            setTimeout(() => {
                countDisplay.classList.remove('scale-125', 'text-error');
            }, 300);

            // Add a mini cloud effect
            const miniCloud = document.createElement('span');
            miniCloud.className = 'material-symbols-outlined absolute text-cloud-gray transition-all duration-1000 opacity-0';
            miniCloud.style.fontSize = '24px';
            miniCloud.style.left = '50%';
            miniCloud.style.top = '50%';
            miniCloud.innerText = 'cloud';
            cloudContainer.appendChild(miniCloud);

            requestAnimationFrame(() => {
                miniCloud.style.transform = `translate(${(Math.random()-0.5)*150}px, ${(Math.random()-0.5)*150}px) scale(2)`;
                miniCloud.style.opacity = '0.4';
            });

            setTimeout(() => {
                miniCloud.remove();
            }, 1000);
        }
    </script>
