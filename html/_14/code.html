<body class="bg-surface-cream text-on-surface min-h-screen pb-32" data-mode="connect">
<!-- Header (Shared Component: TopAppBar - Adjusted for Sub-page) -->
<header class="w-full top-0 sticky z-40 bg-surface/80 backdrop-blur-md flex justify-between items-center px-container-padding py-unit shadow-sm"><div class="flex items-center gap-3"><button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container-high transition-colors active-press" onclick="history.back()"><span class="material-symbols-outlined text-primary">arrow_back</span></button><h1 class="font-headline-md text-headline-md text-primary font-bold">性格养成&nbsp;</h1></div><button class="px-4 py-2 rounded-full border border-outline-variant font-label-caps text-label-caps text-on-surface-variant hover:bg-surface-container-high transition-colors active-press">规则详情</button></header>

font-variation-settings: 'wght' 700;">add</span></button></div><div class="group relative flex items-center justify-between p-card-inner bg-surface-cream border border-outline-variant/40 rounded-lg shadow-sm hover:shadow-md transition-all active-press cursor-pointer"><div class="flex items-center gap-4"><div class="w-12 h-12 rounded-full bg-secondary-fixed/30 flex items-center justify-center text-secondary"><span class="material-symbols-outlined text-3xl">chat_bubble</span></div><div><h3 class="font-headline-md text-headline-md text-on-surface">主动和认识的人打招呼</h3><p class="text-label-caps text-secondary font-bold">+2 颗星星</p></div></div><button class="w-12 h-12 flex items-center justify-center rounded-xl bg-primary-container text-on-primary-container shadow-sm active-press"><span class="material-symbols-outlined text-2xl" style="font-variation-settings: 'wght' 700;">add</span></button></div><div class="group relative flex items-center justify-between p-card-inner bg-surface-cream border border-outline-variant/40 rounded-lg shadow-sm hover:shadow-md transition-all active-press cursor-pointer"><div class="flex items-center gap-4"><div class="w-12 h-12 rounded-full bg-tertiary-fixed/40 flex items-center justify-center text-tertiary"><span class="material-symbols-outlined text-3xl">volume_off</span></div><div><h3 class="font-headline-md text-headline-md text-on-surface">公共场合不大声喧哗</h3><p class="text-label-caps text-secondary font-bold">+2 颗星星</p></div></div><button class="w-12 h-12 flex items-center justify-center rounded-xl bg-primary-container text-on-primary-container shadow-sm active-press"><span class="material-symbols-outlined text-2xl" style="font-variation-settings: 'wght' 700;">add</span></button></div><div class="group relative flex items-center justify-between p-card-inner bg-surface-cream border border-outline-variant/40 rounded-lg shadow-sm hover:shadow-md transition-all active-press cursor-pointer"><div class="flex items-center gap-4"><div class="w-12 h-12 rounded-full bg-energy-green/10 flex items-center justify-center text-energy-green"><span class="material-symbols-outlined text-3xl">family_restroom</span></div><div><h3 class="font-headline-md text-headline-md text-on-surface">尊敬长辈，不顶嘴</h3><p class="text-label-caps text-secondary font-bold">+3 颗星星</p></div></div><button class="w-12 h-12 flex items-center justify-center rounded-xl bg-primary-container text-on-primary-container shadow-sm active-press"><span class="material-symbols-outlined text-2xl" style="font-variation-settings: 'wght' 700;">add</span></button></div><div class="group relative flex items-center justify-between p-card-inner bg-surface-cream border border-outline-variant/40 rounded-lg shadow-sm hover:shadow-md transition-all active-press cursor-pointer"><div class="flex items-center gap-4"><div class="w-12 h-12 rounded-full bg-primary-fixed/40 flex items-center justify-center text-primary"><span class="material-symbols-outlined text-3xl">lightbulb</span></div><div><h3 class="font-headline-md text-headline-md text-on-surface">遇到难题想办法解决</h3><p class="text-label-caps text-secondary font-bold">+5 颗星星</p></div></div><button class="w-12 h-12 flex items-center justify-center rounded-xl bg-primary-container text-on-primary-container shadow-sm active-press"><span class="material-symbols-outlined text-2xl" style="font-variation-settings: 'wght' 700;">add</span></button></div></div><div class="grid grid-cols-2 gap-4"><div class="p-card-inner bg-secondary-fixed/30 rounded-lg border border-secondary-fixed/50 flex flex-col justify-between aspect-square"><span class="material-symbols-outlined text-secondary text-3xl">history</span><div><p class="text-on-secondary-fixed-variant font-bold">坚持天数</p><p class="font-hero-numeral text-3xl text-secondary">15</p></div></div><div class="p-card-inner bg-tertiary-fixed/30 rounded-lg border border-tertiary-fixed/50 flex flex-col justify-between aspect-square"><span class="material-symbols-outlined text-tertiary text-3xl">military_tec <!-- Bottom Navigation Shell (Shared Component) -->
<div class="fixed bottom-0 left-0 w-full p-container-padding pb-10 bg-gradient-to-t from-surface via-surface/95 to-transparent z-50"><button class="w-full h-16 bg-on-surface text-surface flex items-center justify-center gap-3 rounded-full shadow-lg active-press transition-transform"><span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">add_circle</span><span class="font-headline-md text-headline-md">自定义添加新计划</span></button></div>
<script>
        // Micro-interaction for buttons
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('click', function() {
                if(this.innerText === '记录') {
                    const stars = document.querySelector('.bg-primary-container .text-primary');
                    let count = parseInt(stars.innerText);
                    stars.innerText = count + 1;
                    
                    // Small pop effect for stars counter
                    stars.parentElement.animate([
                        { transform: 'scale(1)' },
                        { transform: 'scale(1.2)' },
                        { transform: 'scale(1)' }
                    ], { duration: 300 });
                }
            });
        });
    </script>
