<style>

            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass-jar {
            backdrop-filter: blur(16px);
            background: rgba(255, 255, 255, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.6);
        }
        .star-shimmer {
            animation: shimmer 3s infinite ease-in-out;
        }
        @keyframes shimmer {
            0%, 100% { opacity: 0.8; transform: scale(1); filter: drop-shadow(0 0 10px rgba(255, 210, 20, 0.4)); }
            50% { opacity: 1; transform: scale(1.1); filter: drop-shadow(0 0 20px rgba(255, 210, 20, 0.8)); }
        }
        .progress-shimmer {
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            background-size: 200% 100%;
            animation: shimmer-move 2s infinite linear;
        }
        @keyframes shimmer-move {
            from { background-position: 200% 0; }
            to { background-position: -200% 0; }
        }
        body {
            background-color: #fbf9f4;
            color: #1b1c19;
            -webkit-tap-highlight-color: transparent;
        }

        // Simple micro-interaction for the progress circle

            const circle = document.querySelector('circle:last-child');

                // Trigger initial animation
                circle.style.transition = 'stroke-dashoffset 1.5s ease-out';
            }

            // Button click sound effect (simulated with visual feedback)
            const buttons = document.querySelectorAll('button');
            buttons.forEach(btn => {
                btn.addEventListener('click', () => {
                    const ripple = document.createElement('div');
                    ripple.className = 'absolute inset-0 bg-white/20 rounded-full animate-ping pointer-events-none';
                    btn.appendChild(ripple);
                    setTimeout(() => ripple.remove(), 500);
                });
            });
        });
    </script>
