<script>
        document.getElementById('redeem-btn').addEventListener('click', function() {
            // Simple visual feedback for button click
            const btn = this;
            const originalContent = btn.innerHTML;
            
            btn.innerHTML = `
                <svg class="animate-spin h-6 w-6 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                处理中...
            `;
            
            setTimeout(() => {
                btn.classList.replace('from-primary', 'from-energy-green');
                btn.classList.replace('to-secondary', 'to-energy-green');
                btn.innerHTML = `
                    <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">check_circle</span>
                    兑换成功!
                `;
                
                // Trigger a confetti-like sparkle effect (simulated)
                console.log('Confetti effect triggered');
