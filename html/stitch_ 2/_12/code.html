<style>
        .glass-jar-effect {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(20px);
            border: 1.5px solid rgba(255, 255, 255, 0.8);
        }
        .cloud-shadow {
            box-shadow: 0 30px 60px -12px rgba(255, 132, 0, 0.15);
        }
        .squishy-button {
            box-shadow: 0 4px 0px 0px #e8c426;
            transition: all 0.1s ease;
        }
        .squishy-button:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0px 0px #e8c426;
        }
        .animate-float {
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(2deg); }
        }
        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            border-radius: 2px;
            animation: fall linear forwards;
        }
        @keyframes fall {
            to { transform: translateY(100vh) rotate(720deg); opacity: 0; }
        }
        .star-pulse {
            animation: starPulse 2s ease-in-out infinite;
        }
        @keyframes starPulse {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.3); opacity: 1; }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-background font-body-md text-on-background overflow-hidden">
<!-- 全屏模糊背景 -->
<div class="fixed inset-0 z-0 overflow-hidden">
<img class="w-full h-full object-cover blur-2xl scale-110 opacity-40" data-alt="A soft and dreamy background featuring pastel gradients of warm yellows and gentle creams, creating a magical atmosphere of encouragement and warmth. The lighting is diffused and high-key, aligning with a clean and modern light-mode aesthetic. Subtle floating bokeh particles add a sense of depth and wonder to the minimalist landscape." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAEapN1fyu7Ho6hi8N_Y10nLMhcIhUQEbv-EJaK0YuieHLqcjzycmgz5V389jTwz4Eb6SAuwMV1sJ8Rd3gLWaJJgKv0fSnuBk4gIqgEuHYZrLPWru33LimOQiF_1f_Z9vnnn_4SW3ju_dYtix9vL18_j89KMG4Ofi6ZPO6OXqxmxleIHX1Ll7QwsMSK3L1QmRdIL1KxW3VrEOveEbv0dokwVlWYPz1a-6JLAZPjCmQKv5PO3tX3V0ZutB3nAQLIOgH5xR2AswnG7CG5"/>
</div>
<!-- 奖励弹窗主体 -->
<main class="relative z-10 flex flex-col items-center justify-center min-h-screen px-container-margin">
<!-- 彩带与星星背景特效容器 -->
<div class="absolute inset-0 pointer-events-none" id="fx-container"></div>
<!-- 玻璃感中心容器 -->
<div class="glass-jar-effect rounded-xl p-lg flex flex-col items-center text-center max-w-[480px] w-full cloud-shadow relative">
<!-- 装饰性星星 -->
<div class="absolute -top-8 -left-4 star-pulse text-primary-container">
<span class="material-symbols-outlined !text-[48px]" style="font-variation-settings: 'FILL' 1;">stars</span>
</div>
<div class="absolute top-12 -right-6 star-pulse text-secondary-container" style="animation-delay: 0.5s;">
<span class="material-symbols-outlined !text-[32px]" style="font-variation-settings: 'FILL' 1;">stars</span>
</div>
<!-- 发光的金色宝箱 -->
<div class="relative mb-md animate-float">
<div class="absolute inset-0 bg-primary-fixed blur-3xl opacity-40 rounded-full scale-150"></div>
<div class="relative z-10 w-48 h-48 flex items-center justify-center">
<span class="material-symbols-outlined !text-[120px] text-primary" style="font-variation-settings: 'FILL' 1;">featured_seasonal_and_gifts</span>
</div>
</div>
<!-- 文字信息区 -->
<header class="space-y-sm mb-lg">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-primary">
                    太棒了！
                </h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">
                    恭喜宝贝获得额外奖励
                </p>
<!-- 奖励数值展示 -->
<div class="flex items-center justify-center gap-xs mt-base bg-primary-container/30 py-sm px-md rounded-full inline-flex mx-auto border border-primary-container/50">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">stars</span>
<span class="font-headline-md text-headline-md text-primary">星星 +10</span>
</div>
</header>
<!-- 底部按钮 -->
<footer class="w-full">
<button class="squishy-button w-full bg-primary-container hover:bg-primary-fixed-dim text-on-primary-container font-headline-md text-headline-md py-base rounded-full transition-colors flex items-center justify-center min-h-[56px]" onclick="collectReward()">
                    收下奖励
                </button>
</footer>
</div>
</main>
<script>
        // 生成彩带特效
        function createConfetti() {
            const container = document.getElementById('fx-container');
            const colors = ['#ffe173', '#fc8200', '#e8c426', '#ffd93d', '#ffffff'];
            
            for (let i = 0; i < 60; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.top = '-20px';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.width = (Math.random() * 10 + 5) + 'px';
                confetti.style.height = (Math.random() * 5 + 5) + 'px';
                confetti.style.animationDuration = (Math.random() * 3 + 2) + 's';
                confetti.style.animationDelay = (Math.random() * 2) + 's';
                container.appendChild(confetti);

                // 移除已结束动画的元素
                confetti.addEventListener('animationend', () => confetti.remove());
            }
        }

        // 生成漂浮星星
        function createStars() {
            const container = document.getElementById('fx-container');
            for (let i = 0; i < 15; i++) {
                const star = document.createElement('span');
                star.className = 'material-symbols-outlined absolute text-primary-fixed-dim opacity-0 transition-opacity duration-1000';
                star.style.fontVariationSettings = "'FILL' 1";
                star.innerText = 'stars';
                star.style.fontSize = (Math.random() * 20 + 10) + 'px';
                star.style.left = Math.random() * 100 + 'vw';
                star.style.top = Math.random() * 100 + 'vh';
                
                container.appendChild(star);
                
                setTimeout(() => {
                    star.style.opacity = '0.6';
                }, Math.random() * 1000);
            }
        }

        // 初始化特效
        window.onload = () => {
            createConfetti();
            createStars();
        };

        // 按钮交互逻辑
        function collectReward() {
            const main = document.querySelector('main');
            main.style.transition = 'all 0.5s ease-out';
            main.style.transform = 'scale(0.9)';
            main.style.opacity = '0';
            
            setTimeout(() => {
                alert('奖励已放入星空罐！');
                location.reload(); // 模拟返回
            }, 500);
        }
    </script>
</body></html>
