<script>
        function addCloud(amount) {
            // Simplified micro-interaction for recording a penalty
            const btn = event.currentTarget;
            const originalText = btn.innerText;
            
            btn.innerHTML = '<span class="material-symbols-outlined text-[18px]">done</span>';
            btn.classList.add('bg-on-surface', 'text-surface');
            
            setTimeout(() => {
                btn.innerText = originalText;
                btn.classList.remove('bg-on-surface', 'text-surface');
                
                // Show a brief toast notification
                const toast = document.createElement('div');
                toast.className = 'fixed top-20 left-1/2 -translate-x-1/2 bg-inverse-surface text-inverse-on-surface px-6 py-3 rounded-full z-[100] shadow-xl font-body-md animate-bounce';
                toast.innerText = `已添加 ${amount} 乌云`;
                document.body.appendChild(toast);
                
                setTimeout(() => toast.remove(), 2000);
            }, 600);
        }
    </script>
