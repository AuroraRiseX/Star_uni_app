<script>
        // Micro-interaction for rain animation
        function createRain() {
            const container = document.querySelector('.glass-jar');
            if (!container) return;
            const drop = document.createElement('div');
            drop.className = 'rain-drop';
            drop.style.left = Math.random() * 80 + 10 + '%';
            drop.style.top = Math.random() * 20 + 10 + '%';
            drop.style.animationDuration = Math.random() * 0.5 + 0.5 + 's';
            container.appendChild(drop);
            setTimeout(() => drop.remove(), 1000);
        }
        setInterval(createRain, 800);

        // Active state feedback
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('click', function() {
                this.classList.add('scale-90');
                setTimeout(() => this.classList.remove('scale-90'), 200);
            });
        });
