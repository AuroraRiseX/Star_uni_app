<script>
        // Micro-interaction for the jar
        document.querySelector('.glass-jar').addEventListener('click', function() {
            this.style.transform = 'scale(0.96)';
            setTimeout(() => {
                this.style.transform = 'scale(1)';
            }, 100);
            
            const effect = document.createElement('div');
            effect.innerText = '✨';
            effect.className = 'absolute text-2xl pointer-events-none transition-all duration-700 z-50';
            effect.style.left = '50%';
            effect.style.top = '40%';
            effect.style.opacity = '1';
            this.parentElement.appendChild(effect);
            
            setTimeout(() => {
                effect.style.transform = 'translateY(-60px) scale(1.5)';
                effect.style.opacity = '0';
            }, 50);
            
            setTimeout(() => effect.remove(), 800);
        });
    </script>
