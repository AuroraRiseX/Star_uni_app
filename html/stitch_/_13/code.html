<!DOCTYPE html>

<html lang="zh-CN"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>通用设置 - Star Jar</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Quicksand:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-bright": "#faf9f9",
                        "secondary": "#944a00",
                        "tertiary-fixed": "#e6e3d1",
                        "secondary-container": "#fc8200",
                        "on-error": "#ffffff",
                        "on-primary": "#ffffff",
                        "on-surface-variant": "#4d4633",
                        "on-secondary": "#ffffff",
                        "on-secondary-container": "#5d2c00",
                        "tertiary-fixed-dim": "#cac7b6",
                        "secondary-fixed-dim": "#ffb784",
                        "primary-fixed-dim": "#e8c426",
                        "inverse-surface": "#2f3131",
                        "surface-variant": "#e3e2e2",
                        "primary-container": "#ffd93d",
                        "primary-fixed": "#ffe173",
                        "primary": "#705d00",
                        "on-tertiary-container": "#626153",
                        "on-primary-fixed": "#221b00",
                        "surface-container-lowest": "#ffffff",
                        "on-secondary-fixed": "#301400",
                        "secondary-fixed": "#ffdcc6",
                        "on-tertiary-fixed": "#1d1c11",
                        "inverse-on-surface": "#f1f0f0",
                        "surface-container-low": "#f4f3f3",
                        "on-background": "#1a1c1c",
                        "surface-container-high": "#e9e8e8",
                        "on-primary-fixed-variant": "#554500",
                        "on-error-container": "#93000a",
                        "tertiary": "#605f51",
                        "background": "#faf9f9",
                        "outline": "#7e7761",
                        "surface-container": "#eeeeed",
                        "on-surface": "#1a1c1c",
                        "surface-dim": "#dadada",
                        "error-container": "#ffdad6",
                        "tertiary-container": "#dfdccb",
                        "on-secondary-fixed-variant": "#713700",
                        "surface": "#faf9f9",
                        "on-primary-container": "#725e00",
                        "surface-tint": "#705d00",
                        "surface-container-highest": "#e3e2e2",
                        "error": "#ba1a1a",
                        "outline-variant": "#d0c6ad",
                        "on-tertiary": "#ffffff",
                        "inverse-primary": "#e8c426",
                        "on-tertiary-fixed-variant": "#48473a"
                    },
                    "borderRadius": {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "container-margin": "20px",
                        "gutter": "16px",
                        "xl": "64px",
                        "sm": "12px",
                        "lg": "40px",
                        "md": "24px",
                        "base": "8px",
                        "xs": "4px"
                    },
                    "fontFamily": {
                        "headline-lg-mobile": ["Plus Jakarta Sans"],
                        "headline-md": ["Plus Jakarta Sans"],
                        "label-sm": ["Quicksand"],
                        "body-md": ["Quicksand"],
                        "label-lg": ["Quicksand"],
                        "headline-lg": ["Plus Jakarta Sans"],
                        "body-lg": ["Quicksand"]
                    },
                    "fontSize": {
                        "headline-lg-mobile": ["26px", {"lineHeight": "32px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                        "headline-md": ["24px", {"lineHeight": "30px", "fontWeight": "700"}],
                        "label-sm": ["12px", {"lineHeight": "16px", "fontWeight": "600"}],
                        "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "500"}],
                        "label-lg": ["14px", {"lineHeight": "20px", "letterSpacing": "0.05em", "fontWeight": "700"}],
                        "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                        "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "500"}]
                    }
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1.5px solid rgba(255, 255, 255, 0.6);
        }
        .switch-checkbox:checked + .switch-label {
            background-color: #ffd93d; /* primary-container */
        }
        .switch-checkbox:checked + .switch-label .switch-dot {
            transform: translateX(20px);
            background-color: #705d00; /* primary */
        }
        body {
            background-color: #faf9f9; /* surface-bright */
            background-image: 
                radial-gradient(at 0% 0%, rgba(255, 217, 61, 0.1) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(255, 132, 0, 0.05) 0px, transparent 50%);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="min-h-screen text-on-surface font-body-md overflow-x-hidden">
<!-- Top AppBar (Back Action suppresses BottomNav) -->
<nav class="fixed top-0 w-full z-50 bg-surface/40 backdrop-blur-xl border-b border-white/20 shadow-[0_30px_60px_-12px_rgba(255,132,0,0.1)] h-16">
<div class="flex justify-between items-center px-container-margin h-full w-full max-w-7xl mx-auto">
<div class="flex items-center gap-4">
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container transition-colors" onclick="history.back()">
<span class="material-symbols-outlined text-primary">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold text-secondary">通用设置</h1>
</div>
<div class="flex items-center">
<span class="material-symbols-outlined text-primary-fixed-dim">settings</span>
</div>
</div>
</nav>
<!-- Content Canvas -->
<main class="pt-24 pb-12 px-container-margin max-w-2xl mx-auto space-y-md">
<!-- Header Visual Section -->
<section class="flex flex-col items-center text-center mb-lg">
<div class="w-20 h-20 rounded-xl glass-card flex items-center justify-center mb-md shadow-[0_20px_40px_rgba(255,132,0,0.1)]">
<span class="material-symbols-outlined text-[40px] text-primary" style="font-variation-settings: 'FILL' 1;">tune</span>
</div>
<h2 class="font-headline-md text-headline-md text-on-surface">偏好设置</h2>
<p class="font-body-md text-body-md text-on-surface-variant max-w-xs mt-2">在这里调整 Star Jar 的使用体验，让它更适合您和孩子。</p>
</section>
<!-- Settings Group 1: Behavior -->
<div class="space-y-sm">
<h3 class="px-base font-label-lg text-label-lg text-outline uppercase tracking-wider">系统体验</h3>
<div class="glass-card rounded-lg overflow-hidden divide-y divide-white/20 shadow-[0_10px_30px_rgba(0,0,0,0.02)]">
<!-- Sound Effects -->
<div class="flex items-center justify-between p-md hover:bg-white/20 transition-colors">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full bg-primary-container/30 flex items-center justify-center">
<span class="material-symbols-outlined text-primary">volume_up</span>
</div>
<div>
<p class="font-body-lg text-body-lg text-on-surface">音效开关</p>
<p class="text-label-sm text-on-surface-variant">开启收集星星时的灵动音效</p>
</div>
</div>
<div class="relative inline-block w-12 h-7 align-middle select-none transition duration-200 ease-in">
<input checked="" class="switch-checkbox absolute block w-0 h-0 opacity-0" id="sound_toggle" name="toggle" type="checkbox"/>
<label class="switch-label block overflow-hidden h-7 rounded-full bg-surface-container-highest cursor-pointer transition-colors" for="sound_toggle">
<span class="switch-dot block w-5 h-5 rounded-full bg-white shadow-sm mt-1 ml-1 transform transition-transform duration-200"></span>
</label>
</div>
</div>
<!-- Push Notifications -->
<div class="flex items-center justify-between p-md hover:bg-white/20 transition-colors">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full bg-secondary-fixed/30 flex items-center justify-center">
<span class="material-symbols-outlined text-secondary">notifications</span>
</div>
<div>
<p class="font-body-lg text-body-lg text-on-surface">消息推送开关</p>
<p class="text-label-sm text-on-surface-variant">第一时间获取孩子的进步提醒</p>
</div>
</div>
<div class="relative inline-block w-12 h-7 align-middle select-none transition duration-200 ease-in">
<input checked="" class="switch-checkbox absolute block w-0 h-0 opacity-0" id="push_toggle" name="toggle" type="checkbox"/>
<label class="switch-label block overflow-hidden h-7 rounded-full bg-surface-container-highest cursor-pointer transition-colors" for="push_toggle">
<span class="switch-dot block w-5 h-5 rounded-full bg-white shadow-sm mt-1 ml-1 transform transition-transform duration-200"></span>
</label>
</div>
</div>
<!-- Night Mode -->
<div class="flex items-center justify-between p-md hover:bg-white/20 transition-colors">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full bg-tertiary-container/30 flex items-center justify-center">
<span class="material-symbols-outlined text-tertiary">dark_mode</span>
</div>
<div>
<p class="font-body-lg text-body-lg text-on-surface">夜间模式</p>
<p class="text-label-sm text-on-surface-variant">睡前使用更护眼</p>
</div>
</div>
<div class="relative inline-block w-12 h-7 align-middle select-none transition duration-200 ease-in">
<input class="switch-checkbox absolute block w-0 h-0 opacity-0" id="dark_toggle" name="toggle" type="checkbox"/>
<label class="switch-label block overflow-hidden h-7 rounded-full bg-surface-container-highest cursor-pointer transition-colors" for="dark_toggle">
<span class="switch-dot block w-5 h-5 rounded-full bg-white shadow-sm mt-1 ml-1 transform transition-transform duration-200"></span>
</label>
</div>
</div>
</div>
</div>
<!-- Settings Group 2: Storage & Info -->
<div class="space-y-sm pt-4">
<h3 class="px-base font-label-lg text-label-lg text-outline uppercase tracking-wider">存储与更新</h3>
<div class="glass-card rounded-lg overflow-hidden divide-y divide-white/20 shadow-[0_10px_30px_rgba(0,0,0,0.02)]">
<!-- Clear Cache -->
<button class="w-full flex items-center justify-between p-md hover:bg-white/20 transition-all active:scale-[0.98]" onclick="handleClearCache()">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full bg-surface-container flex items-center justify-center">
<span class="material-symbols-outlined text-outline">cleaning_services</span>
</div>
<div class="text-left">
<p class="font-body-lg text-body-lg text-on-surface">清理缓存</p>
<p class="text-label-sm text-on-surface-variant" id="cache_size">当前占用 128 MB</p>
</div>
</div>
<span class="material-symbols-outlined text-outline-variant">chevron_right</span>
</button>
<!-- Version Update -->
<button class="w-full flex items-center justify-between p-md hover:bg-white/20 transition-all active:scale-[0.98]">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full bg-surface-container flex items-center justify-center">
<span class="material-symbols-outlined text-outline">update</span>
</div>
<div class="text-left">
<div class="flex items-center gap-2">
<p class="font-body-lg text-body-lg text-on-surface">版本更新</p>
<span class="px-2 py-0.5 rounded-full bg-error text-[10px] text-white font-bold animate-pulse">NEW</span>
</div>
<p class="text-label-sm text-on-surface-variant">当前版本 v2.4.0</p>
</div>
</div>
<div class="flex items-center gap-1 text-primary">
<span class="text-label-sm font-bold">发现新版本</span>
<span class="material-symbols-outlined text-outline-variant">chevron_right</span>
</div>
</button>
</div>
</div>
<!-- Logout / Destructive Action -->
<div class="pt-8">
<button class="w-full h-14 rounded-lg bg-surface-container-low text-error font-body-lg font-bold shadow-sm hover:bg-error-container/20 transition-colors flex items-center justify-center gap-2">
<span class="material-symbols-outlined">logout</span>
                退出登录
            </button>
<p class="text-center text-label-sm text-outline-variant mt-6">Star Jar - 为爱与成长设计</p>
</div>
</main>
<!-- Feedback Toast (Cloud Shaped) -->
<div class="fixed bottom-10 left-1/2 -translate-x-1/2 translate-y-32 opacity-0 transition-all duration-500 ease-out z-[100]" id="toast">
<div class="bg-white/90 backdrop-blur-md px-6 py-4 rounded-[32px] shadow-[0_20px_50px_rgba(255,132,0,0.15)] flex items-center gap-3 border border-white">
<span class="material-symbols-outlined text-primary-container" style="font-variation-settings: 'FILL' 1;">auto_awesome</span>
<span class="text-on-surface font-label-lg" id="toast_message">设置已保存</span>
</div>
</div>
<script>
        function showToast(message) {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toast_message');
            toastMsg.innerText = message;
            
            toast.classList.remove('translate-y-32', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');
            
            setTimeout(() => {
                toast.classList.add('translate-y-32', 'opacity-0');
                toast.classList.remove('translate-y-0', 'opacity-100');
            }, 3000);
        }

        function handleClearCache() {
            const cacheEl = document.getElementById('cache_size');
            showToast('缓存清理成功！');
            cacheEl.innerText = '当前占用 0 MB';
            cacheEl.classList.add('text-primary');
            setTimeout(() => cacheEl.classList.remove('text-primary'), 2000);
        }

        // Interactivity for toggles
        document.querySelectorAll('.switch-checkbox').forEach(toggle => {
            toggle.addEventListener('change', (e) => {
                const label = e.target.closest('div').previousElementSibling.querySelector('p').innerText;
                const state = e.target.checked ? '已开启' : '已关闭';
                showToast(`${label} ${state}`);
                
                // Dark mode logic
                if(e.target.id === 'dark_toggle') {
                    if(e.target.checked) {
                        document.documentElement.classList.add('dark');
                        showToast('已进入深色模式');
                    } else {
                        document.documentElement.classList.remove('dark');
                        showToast('已切换至浅色模式');
                    }
                }
            });
        });

        // Micro-interactions for buttons
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('mousedown', () => {
                btn.style.transform = 'scale(0.96)';
            });
            btn.addEventListener('mouseup', () => {
                btn.style.transform = 'scale(1)';
            });
            btn.addEventListener('mouseleave', () => {
                btn.style.transform = 'scale(1)';
            });
        });
    </script>
</body></html>
