<script>
        // Simple ripple-like feedback for baby cards
        document.querySelectorAll('.glass-card').forEach(card => {
            card.addEventListener('click', function() {
                this.classList.add('ring-2', 'ring-primary/20');
                setTimeout(() => {
                    this.classList.remove('ring-2', 'ring-primary/20');
                }, 400);
            });
        });

        // Atmospheric star particles
        function createStar() {
            const star = document.createElement('div');
            star.innerHTML = '<span class="material-symbols-outlined text-primary-fixed-dim/20" style="font-size: 14px; font-variation-settings: \'FILL\' 1;">star</span>';
            star.style.position = 'fixed';
            star.style.left = Math.random() * 100 + 'vw';
            star.style.top = '100vh';
            star.style.zIndex = '-1';
            star.style.transition = `transform ${5 + Math.random() * 5}s linear, opacity ${5 + Math.random() * 5}s ease-in`;
            document.body.appendChild(star);

            setTimeout(() => {
                star.style.transform = `translateY(-110vh) rotate(${Math.random() * 360}deg)`;
                star.style.opacity = '0';
            }, 100);

            setTimeout(() => {
                star.remove();
            }, 10000);
        }

        setInterval(createStar, 2000);
    </script>
