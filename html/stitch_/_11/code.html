        // Micro-interactions for list items

            btn.addEventListener('click', function(e) {
                if(this.classList.contains('squishy-button')) return;
                
                const ripple = document.createElement('div');
                ripple.className = 'absolute inset-0 bg-primary/10 pointer-events-none opacity-0 transition-opacity duration-300';

                this.appendChild(ripple);
                
                setTimeout(() => ripple.classList.add('opacity-100'), 0);
                setTimeout(() => {
                    ripple.classList.remove('opacity-100');
                    setTimeout(() => ripple.remove(), 300);
                }, 100);
            });
        });

        // Add small parallax effect to profile image on scroll
        window.addEventListener('scroll', () => {
            const scroll = window.scrollY;
            const profile = document.querySelector('.relative.group');
            if (profile) {
                profile.style.transform = `translateY(${scroll * 0.05}px)`;
            }
        });
    </script>
</body></html>
