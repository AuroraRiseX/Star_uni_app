<!DOCTYPE html>

<html lang="zh-CN"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Quicksand:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "surface-bright": "#faf9f9",
                    "secondary": "#944a00",
                    "tertiary-fixed": "#e6e3d1",
                    "secondary-container": "#fc8200",
                    "on-error": "#ffffff",
                    "on-primary": "#ffffff",
                    "on-surface-variant": "#4d4633",
                    "on-secondary": "#ffffff",
                    "on-secondary-container": "#5d2c00",
                    "tertiary-fixed-dim": "#cac7b6",
                    "secondary-fixed-dim": "#ffb784",
                    "primary-fixed-dim": "#e8c426",
                    "inverse-surface": "#2f3131",
                    "surface-variant": "#e3e2e2",
                    "primary-container": "#ffd93d",
                    "primary-fixed": "#ffe173",
                    "primary": "#705d00",
                    "on-tertiary-container": "#626153",
                    "on-primary-fixed": "#221b00",
                    "surface-container-lowest": "#ffffff",
                    "on-secondary-fixed": "#301400",
                    "secondary-fixed": "#ffdcc6",
                    "on-tertiary-fixed": "#1d1c11",
                    "inverse-on-surface": "#f1f0f0",
                    "surface-container-low": "#f4f3f3",
                    "on-background": "#1a1c1c",
                    "surface-container-high": "#e9e8e8",
                    "on-primary-fixed-variant": "#554500",
                    "on-error-container": "#93000a",
                    "tertiary": "#605f51",
                    "background": "#faf9f9",
                    "outline": "#7e7761",
                    "surface-container": "#eeeeed",
                    "on-surface": "#1a1c1c",
                    "surface-dim": "#dadada",
                    "error-container": "#ffdad6",
                    "tertiary-container": "#dfdccb",
                    "on-secondary-fixed-variant": "#713700",
                    "surface": "#faf9f9",
                    "on-primary-container": "#725e00",
                    "surface-tint": "#705d00",
                    "surface-container-highest": "#e3e2e2",
                    "error": "#ba1a1a",
                    "outline-variant": "#d0c6ad",
                    "on-tertiary": "#ffffff",
                    "inverse-primary": "#e8c426",
                    "on-tertiary-fixed-variant": "#48473a"
            },
            "borderRadius": {
                    "DEFAULT": "1rem",
                    "lg": "2rem",
                    "xl": "3rem",
                    "full": "9999px"
            },
            "spacing": {
                    "container-margin": "20px",
                    "gutter": "16px",
                    "xl": "64px",
                    "sm": "12px",
                    "lg": "40px",
                    "md": "24px",
                    "base": "8px",
                    "xs": "4px"
            },
            "fontFamily": {
                    "headline-lg-mobile": ["Plus Jakarta Sans"],
                    "headline-md": ["Plus Jakarta Sans"],
                    "label-sm": ["Quicksand"],
                    "body-md": ["Quicksand"],
                    "label-lg": ["Quicksand"],
                    "headline-lg": ["Plus Jakarta Sans"],
                    "body-lg": ["Quicksand"]
            },
            "fontSize": {
                    "headline-lg-mobile": ["26px", {"lineHeight": "32px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "headline-md": ["24px", {"lineHeight": "30px", "fontWeight": "700"}],
                    "label-sm": ["12px", {"lineHeight": "16px", "fontWeight": "600"}],
                    "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "500"}],
                    "label-lg": ["14px", {"lineHeight": "20px", "letterSpacing": "0.05em", "fontWeight": "700"}],
                    "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "500"}]
            }
          },
        },
      }
    </script>
<style>
        body {
            background-color: #faf9f9;
            color: #1a1c1c;
            -webkit-tap-highlight-color: transparent;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(20px);
            border: 1.5px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 30px 60px -12px rgba(255, 132, 0, 0.1);
        }
        .cloud-shadow {
            box-shadow: 0 10px 30px rgba(255, 132, 0, 0.1);
        }
        .squishy-button {
            box-shadow: 0 4px 0px #944a00;
            transition: all 0.1s ease;
        }
        .squishy-button:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0px #944a00;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
        .floating-star {
            animation: float 3s ease-in-out infinite;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="min-h-screen pb-24">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-white/40 backdrop-blur-md border-b border-white/20 shadow-[0_30px_60px_-12px_rgba(255,132,0,0.1)]">
<div class="flex justify-between items-center px-container-margin h-16 w-full max-w-7xl mx-auto">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full bg-surface-container flex items-center justify-center border-2 border-white overflow-hidden">
<span class="material-symbols-outlined text-outline-variant">person</span>
</div>
<span class="font-headline-md text-headline-md font-bold text-secondary">Star Jar</span>
</div>
<button class="w-10 h-10 flex items-center justify-center text-primary hover:opacity-80 transition-opacity">
<span class="material-symbols-outlined">info</span>
</button>
</div>
</header>
<main class="pt-24 px-container-margin max-w-7xl mx-auto">
<!-- Profile Header (Logged Out) -->
<section class="mb-lg flex flex-col items-center text-center cursor-pointer" onclick="showLoginModal()">
<div class="relative mb-md">
<div class="w-24 h-24 rounded-full bg-surface-variant flex items-center justify-center border-4 border-white cloud-shadow overflow-hidden">
<span class="material-symbols-outlined text-outline-variant !text-[48px]" style="font-variation-settings: 'wght' 200;">account_circle</span>
</div>
<div class="absolute -bottom-2 -right-2 bg-primary-container p-2 rounded-full border-2 border-white floating-star">
<span class="material-symbols-outlined text-on-primary-container !text-[20px]" style="font-variation-settings: 'FILL' 1;">stars</span>
</div>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-xs">点击登录/注册</h1>
<p class="font-body-md text-body-md text-on-surface-variant">开启您的育儿魔力之旅</p>
</section>
<!-- Stats Overview Placeholder -->
<div class="grid grid-cols-2 gap-gutter mb-lg">
<div class="glass-card p-md rounded-lg flex flex-col items-center justify-center opacity-60">
<span class="font-headline-md text-headline-md text-primary">-</span>
<span class="font-label-sm text-label-sm text-on-surface-variant">累积星星</span>
</div>
<div class="glass-card p-md rounded-lg flex flex-col items-center justify-center opacity-60">
<span class="font-headline-md text-headline-md text-secondary">-</span>
<span class="font-label-sm text-label-sm text-on-surface-variant">待领奖励</span>
</div>
</div>
<!-- Function List -->
<div class="glass-card rounded-lg overflow-hidden mb-lg">
<div class="divide-y divide-white/20">
<!-- Row 1 -->
<button class="w-full flex items-center justify-between p-md hover:bg-white/40 transition-colors" onclick="showLoginModal()">
<div class="flex items-center gap-md">
<div class="w-10 h-10 rounded-full bg-primary-fixed/30 flex items-center justify-center text-primary">
<span class="material-symbols-outlined">child_care</span>
</div>
<span class="font-body-lg text-body-lg text-on-surface">宝贝管理</span>
</div>
<span class="material-symbols-outlined text-outline-variant">chevron_right</span>
</button>
<!-- Row 2 -->
<button class="w-full flex items-center justify-between p-md hover:bg-white/40 transition-colors" onclick="showLoginModal()">
<div class="flex items-center gap-md">
<div class="w-10 h-10 rounded-full bg-secondary-fixed/30 flex items-center justify-center text-secondary">
<span class="material-symbols-outlined">history</span>
</div>
<span class="font-body-lg text-body-lg text-on-surface">成长历史</span>
</div>
<span class="material-symbols-outlined text-outline-variant">chevron_right</span>
</button>
<!-- Row 3 -->
<button class="w-full flex items-center justify-between p-md hover:bg-white/40 transition-colors" onclick="showLoginModal()">
<div class="flex items-center gap-md">
<div class="w-10 h-10 rounded-full bg-tertiary-container flex items-center justify-center text-tertiary">
<span class="material-symbols-outlined">settings</span>
</div>
<span class="font-body-lg text-body-lg text-on-surface">通用设置</span>
</div>
<span class="material-symbols-outlined text-outline-variant">chevron_right</span>
</button>
</div>
</div>
<!-- Help & Feedback -->
<div class="glass-card rounded-lg overflow-hidden">
<button class="w-full flex items-center justify-between p-md hover:bg-white/40 transition-colors" onclick="showLoginModal()">
<div class="flex items-center gap-md">
<div class="w-10 h-10 rounded-full bg-surface-container flex items-center justify-center text-on-surface-variant">
<span class="material-symbols-outlined">help_outline</span>
</div>
<span class="font-body-lg text-body-lg text-on-surface">帮助与反馈</span>
</div>
<span class="material-symbols-outlined text-outline-variant">chevron_right</span>
</button>
</div>
</main>
<!-- Login Modal Overlay -->
<div class="fixed inset-0 z-[100] hidden items-center justify-center px-container-margin" id="login-modal">
<div class="absolute inset-0 bg-inverse-surface/40 backdrop-blur-sm" onclick="hideLoginModal()"></div>
<div class="relative bg-white rounded-lg w-full max-w-sm p-lg text-center animate-in fade-in zoom-in duration-300">
<div class="w-20 h-20 bg-primary-container rounded-full flex items-center justify-center mx-auto mb-md cloud-shadow">
<span class="material-symbols-outlined !text-[40px] text-on-primary-container" style="font-variation-settings: 'FILL' 1;">lock</span>
</div>
<h2 class="font-headline-md text-headline-md text-on-surface mb-xs">登录开始收集星星</h2>
<p class="font-body-md text-body-md text-on-surface-variant mb-lg">登录后即可记录宝贝的每一个进步瞬间</p>
<div class="flex flex-col gap-md">
<button class="squishy-button w-full bg-primary-container text-on-primary-container py-4 rounded-lg font-label-lg text-label-lg transition-transform active:scale-95">
                    立即登录
                </button>
<button class="w-full text-on-surface-variant font-label-lg text-label-lg py-2" onclick="hideLoginModal()">
                    稍后再说
                </button>
</div>
</div>
</div>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 w-full z-50 rounded-t-lg bg-surface/80 dark:bg-inverse-surface/80 backdrop-blur-lg border-t border-white/20 shadow-[0_-10px_40px_rgba(255,132,0,0.05)]">
<div class="fixed bottom-0 left-0 w-full flex justify-around items-center px-4 pb-4 pt-2">
<!-- Home -->
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline-variant px-4 py-1 hover:bg-secondary-fixed/20 transition-all">
<span class="material-symbols-outlined">home</span>
<span class="font-label-sm text-label-sm mt-1">首页</span>
</button>
<!-- Reward -->
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline-variant px-4 py-1 hover:bg-secondary-fixed/20 transition-all">
<span class="material-symbols-outlined">stars</span>
<span class="font-label-sm text-label-sm mt-1">奖惩</span>
</button>
<!-- Shop -->
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline-variant px-4 py-1 hover:bg-secondary-fixed/20 transition-all">
<span class="material-symbols-outlined">shopping_bag</span>
<span class="font-label-sm text-label-sm mt-1">店铺</span>
</button>
<!-- Profile (Active) -->
<button class="flex flex-col items-center justify-center bg-primary-container dark:bg-primary text-on-primary-container dark:text-on-primary rounded-xl px-4 py-1 scale-90 transition-all duration-300 ease-out">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">person</span>
<span class="font-label-sm text-label-sm mt-1">我的</span>
</button>
</div>
</nav>
<script>
        function showLoginModal() {
            const modal = document.getElementById('login-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            document.body.style.overflow = 'hidden';
        }

        function hideLoginModal() {
            const modal = document.getElementById('login-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
            document.body.style.overflow = 'auto';
        }

        // Optional: Simple touch animation for cards
        document.querySelectorAll('.glass-card button').forEach(button => {
            button.addEventListener('touchstart', () => {
                button.style.transform = 'scale(0.98)';
            });
            button.addEventListener('touchend', () => {
                button.style.transform = 'scale(1)';
            });
        });
    </script>
</body></html>
